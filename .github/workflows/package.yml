name: 多平台打包与镜像发布

# 任意 push 都构建：交叉编译 4 个平台的可执行包（飞牛 x86-64 / ARM64、Linux 32 位、
# Windows 64 位）上传到 Actions 产物，发布 amd64+arm64 多架构 Docker 镜像到 GHCR，
# 并滚动更新固定的 latest Release（压缩包 + 裸二进制 + 校验和），始终指向最新构建。
on:
  push:
  workflow_dispatch:

# 与部署流水线并存、互不阻塞；后到的 push 排队而不是取消进行中的发布。
concurrency:
  group: assetspider-package
  cancel-in-progress: false

# 推 GHCR 需要 packages:write；contents:read 用于检出代码。
permissions:
  contents: read
  packages: write

jobs:
  # 前端只构建一次，作为产物供各平台打包复用，避免 matrix 里重复 npm ci。
  frontend:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建 Vue 前端
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # 交叉编译矩阵：纯 Go 驱动无需 CGO，CGO_ENABLED=0 静态编译。
  packages:
    name: 打包 ${{ matrix.label }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64    # 飞牛 x86-64 / 通用 Linux 64 位
            label: linux-amd64
          - platform: linux/arm64    # 飞牛 ARM（aarch64）
            label: linux-arm64
          - platform: linux/386      # Linux 32 位
            label: linux-386
          - platform: windows/amd64  # Windows 64 位
            label: windows-amd64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: 交叉编译并打包
        env:
          PLATFORM: ${{ matrix.platform }}
          SKIP_WEB: '1'
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/package.sh

      - name: 上传发布包与裸二进制
        uses: actions/upload-artifact@v4
        with:
          name: assetspider-${{ matrix.label }}
          path: |
            release/assetspider-${{ matrix.label }}.tar.gz
            release/assetspider-${{ matrix.label }}.zip
            release/assetspider-${{ matrix.label }}
            release/assetspider-${{ matrix.label }}.exe
          if-no-files-found: error
          retention-days: 14

  # buildx + QEMU 构建 amd64/arm64 镜像，构建阶段跑在原生架构、仅运行层模拟。
  docker:
    name: 发布 Docker 镜像到 GHCR
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 每次 push 都滚动更新固定 tag 的 latest Release：资产只有最新一批，不堆积版本。
  release:
    name: 更新 latest Release
    needs: [packages, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create 要在 git 仓库里创建/定位 latest tag，必须先检出。
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          # 只取 4 个平台的发布包；排除 docker buildx 自动生成的 dockerbuild
          # 元数据 artifact 与 web-dist，避免无关产物下载失败拖垮整个步骤。
          pattern: assetspider-*
          path: release-assets
          merge-multiple: true

      - name: 生成校验和
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum assetspider-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 滚动更新 latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 固定 tag：已存在则先删（连带旧资产），再重建，保证只有最新构建。
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest \
            --title "AssetSpider latest (${REF}@${SHA:0:7})" \
            --notes "自动构建自 ${REF} 分支，提交 ${SHA}。含 4 平台压缩包、裸二进制与 SHA256SUMS.txt。" \
            release-assets/assetspider-* release-assets/SHA256SUMS.txt
