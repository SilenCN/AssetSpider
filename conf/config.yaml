# AssetSpider 默认配置
# 可用 -config 指定其他配置文件；以下环境变量可覆盖同名配置项：
#   ASSETSPIDER_SERVER_ADDR / ASSETSPIDER_DB_PATH / ASSETSPIDER_WEB_DIR
#   ASSETSPIDER_COLLECTOR_TIMEOUT / _MAX_PAGES / _PAGE_SIZE / _DEFAULT_HOURS / _PARALLEL / _PAGE_INTERVAL / _USER_AGENT
#   ASSETSPIDER_AUTH_TOKEN_TTL_HOURS / ASSETSPIDER_AUTH_BCRYPT_COST

server:
  # HTTP 监听地址
  addr: ":8080"

database:
  # 数据库后端：sqlite（默认）或 mysql。
  # 不写 / 写 sqlite 时走下面 path 指向的本地 SQLite 文件；
  # 写 mysql 时忽略 path，改走 dsn 连接串。
  driver: "sqlite"
  # SQLite 数据库文件路径，支持相对路径（相对工作目录）或绝对路径
  path: "data/assetspider.db"
  # MySQL 连接串（driver=mysql 时必填，含账号密码）。例如：
  #   "asset:pwd@tcp(127.0.0.1:3306)/assetspider?charset=utf8mb4&parseTime=true&loc=Local"
  # 连接池参数仅对 MySQL 生效；密码会出现在 DSN 里，切勿提交到公开仓库。
  dsn: ""
  max_open_conns: 16            # MySQL 连接池上限，<=0 用默认 16
  max_idle_conns: 8             # MySQL 空闲连接上限，<=0 用默认（上限的一半）
  conn_max_lifetime_minutes: 30 # MySQL 连接最长存活分钟数，<=0 用默认 30

web:
  # Vue 构建产物目录，由 Gin 托管
  dir: "web/dist"

collector:
  # 视频站点 JSON 采集器（苹果CMS V10 Provide api.php/provide/vod/?ac=videolist）
  timeout_seconds: 20           # 单次接口请求超时（秒）
  max_pages: 4500              # 单次采集最多遍历页数，防止失控
  page_size: 0                 # 0 = 由站点返回决定；>0 时附加苹果CMS 的 pagesize 参数
  user_agent: "AssetSpider/1.0 (+maccms-json-collector)"
  default_incremental_hours: 24 # 站点未单独配置时的增量时间窗（对应接口 h 参数）
  max_concurrent: 3            # 同时运行的采集任务上限，超出的任务排队；也可在页面/接口运行时调整
  page_interval_ms: 0          # 相邻两页之间的间隔（毫秒），0 = 不限速；降低对站点请求频率，页面「系统设置」可改

auth:
  # 登录会话有效期（小时）；令牌只以 SHA-256 摘要存库
  token_ttl_hours: 168         # 默认 7 天
  bcrypt_cost: 10              # 密码哈希强度，范围 4..31，越大越慢

log:
  # 日志同时输出到控制台与本目录下的日志文件；单文件写满 max_size_mb 后自动滚动，
  # 旧日志按 assetspider.1.log / assetspider.2.log ... 保留 max_backups 份，序号越小越新。
  # 修改后需重启服务生效；也可用环境变量覆盖：
  #   ASSETSPIDER_LOG_DIR / ASSETSPIDER_LOG_MAX_SIZE_MB / ASSETSPIDER_LOG_MAX_BACKUPS
  dir: "logs"                  # 日志目录，相对工作目录或绝对路径
  max_size_mb: 5               # 单个日志文件大小上限（MB），超过即滚动
  max_backups: 5               # 保留的历史日志份数，0 表示不保留备份

