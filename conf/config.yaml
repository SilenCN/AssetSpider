# AssetSpider 默认配置
# 可用 -config 指定其他配置文件；以下环境变量可覆盖同名配置项：
#   ASSETSPIDER_SERVER_ADDR / ASSETSPIDER_DB_PATH / ASSETSPIDER_WEB_DIR
#   ASSETSPIDER_COLLECTOR_TIMEOUT / _MAX_PAGES / _PAGE_SIZE / _DEFAULT_HOURS / _PARALLEL / _USER_AGENT

server:
  # HTTP 监听地址
  addr: ":8080"

database:
  # SQLite 数据库文件路径，支持相对路径（相对工作目录）或绝对路径
  path: "data/assetspider.db"

web:
  # Vue 构建产物目录，由 Gin 托管
  dir: "web/dist"

collector:
  # 视频站点 JSON 采集器（苹果CMS V10 Provide api.php/provide/vod/?ac=videolist）
  timeout_seconds: 20           # 单次接口请求超时（秒）
  max_pages: 5000              # 单次采集最多遍历页数，防止失控
  page_size: 0                 # 0 = 由站点返回决定；>0 时附加苹果CMS 的 pagesize 参数
  user_agent: "AssetSpider/1.0 (+maccms-json-collector)"
  default_incremental_hours: 24 # 站点未单独配置时的增量时间窗（对应接口 h 参数）
  max_concurrent: 3            # 同时运行的采集任务上限，超出的任务排队；也可在页面/接口运行时调整
